name: Build Carbon Kernel (cupid)

on:
  workflow_dispatch:
    inputs:
      ksu_variant:
        description: "KernelSU Variant"
        required: true
        type: choice
        default: "next"
        options:
          - "next"
          - "official"
          - "none"
      lto:
        description: "Clang LTO Mode"
        required: true
        type: choice
        default: "thin"
        options:
          - "thin"
          - "none"
      create_release:
        description: "Create GitHub Release"
        type: boolean
        default: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: write

    steps:
      - name: Checkout Carbon Builder
        uses: actions/checkout@v4

      - name: Free Runner Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost /usr/share/swift || true
          df -h /

      - name: Setup Swap
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 16

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ccache cpio curl flex git jq kmod libelf-dev \
            libncurses-dev libssl-dev lld llvm clang file python3 python-is-python3 \
            rsync unzip zip zstd

      - name: Clone Toolchain (Android Clang r416183b)
        run: |
          mkdir -p clang
          git clone --depth=1 --filter=blob:none --no-checkout \
            --branch master-kernel-build-2021 \
            https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 clang-repo
          cd clang-repo
          git checkout 6e3223f76384455acde43affde3df0ea9df66c0d -- clang-r416183b
          mv clang-r416183b/* ../clang/
          cd ..
          rm -rf clang-repo
          ./clang/bin/clang --version

      - name: Clone Kernel Source (LineageOS SM8450)
        run: |
          git clone --depth=1 --branch lineage-24.0 https://github.com/LineageOS/android_kernel_xiaomi_sm8450 kernel-source
          cd kernel-source
          echo "Kernel commit: $(git rev-parse HEAD)"

      - name: Setup KernelSU-Next
        if: ${{ inputs.ksu_variant != 'none' }}
        run: |
          cd kernel-source
          if [ "${{ inputs.ksu_variant }}" = "next" ]; then
            echo "Setting up KernelSU-Next..."
            curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -s next
          elif [ "${{ inputs.ksu_variant }}" = "official" ]; then
            echo "Setting up official KernelSU..."
            curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -
          fi

      - name: Build Kernel Image
        run: |
          cd kernel-source
          export PATH="${GITHUB_WORKSPACE}/clang/bin:${PATH}"
          export ARCH=arm64
          export SUBARCH=arm64
          export KBUILD_BUILD_USER="carbon"
          export KBUILD_BUILD_HOST="github-actions"

          # 1. Base GKI defconfig
          make O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 gki_defconfig

          # 2. Merge vendor fragments for cupid
          ./scripts/kconfig/merge_config.sh -O out -m out/.config \
            arch/arm64/configs/vendor/waipio_GKI.config \
            arch/arm64/configs/vendor/xiaomi_GKI.config \
            arch/arm64/configs/vendor/cupid_GKI.config

          # 3. Enable KernelSU if selected
          if [ "${{ inputs.ksu_variant }}" != "none" ]; then
            ./scripts/config --file out/.config -e KSU
          fi

          # 4. Set Carbon branding in kernel localversion
          ./scripts/config --file out/.config --set-str LOCALVERSION "-Carbon-cupid"

          # 5. Configure LTO
          if [ "${{ inputs.lto }}" = "none" ]; then
            ./scripts/config --file out/.config -d LTO_CLANG -d LTO_CLANG_THIN -d LTO_CLANG_FULL -e LTO_NONE
          else
            ./scripts/config --file out/.config -d LTO_NONE -d LTO_CLANG_FULL -e LTO_CLANG -e LTO_CLANG_THIN
          fi

          make O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 olddefconfig

          # Cap parallel ThinLTO jobs to prevent runner link OOM
          wrapper="${GITHUB_WORKSPACE}/ld-thinlto-wrapper"
          printf '#!/bin/bash\nexec ld.lld "$@" --thinlto-jobs=2\n' > "${wrapper}"
          chmod +x "${wrapper}"
          export LD="${wrapper}"
          export HOSTLD="${wrapper}"

          # Build Image
          make -j2 O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 Image

          if [ ! -s out/arch/arm64/boot/Image ]; then
            echo "::error::Built Image not found!"
            exit 1
          fi
          ls -lh out/arch/arm64/boot/Image

      - name: Package AnyKernel3 ZIP
        run: |
          mkdir -p ak3-pkg
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git ak3-pkg
          cp ak3/anykernel.sh ak3-pkg/anykernel.sh
          cp ak3/banner ak3-pkg/banner
          cp kernel-source/out/arch/arm64/boot/Image ak3-pkg/Image

          ZIP_NAME="Carbon-Kernel-cupid-${{ inputs.ksu_variant }}-r${{ github.run_number }}.zip"
          cd ak3-pkg
          zip -r9 "../${ZIP_NAME}" . -x ".git/*" "README.md"
          cd ..
          sha256sum "${ZIP_NAME}" > "${ZIP_NAME}.sha256"

          echo "ZIP_NAME=${ZIP_NAME}" >> "$GITHUB_ENV"
          echo "ZIP_SHA256=$(cat ${ZIP_NAME}.sha256 | awk '{print $1}')" >> "$GITHUB_ENV"
          mkdir -p release-pkg
          mv "${ZIP_NAME}" release-pkg/
          mv "${ZIP_NAME}.sha256" release-pkg/
          cp kernel-source/out/arch/arm64/boot/Image release-pkg/Image-cupid

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Carbon-Kernel-cupid-${{ inputs.ksu_variant }}-r${{ github.run_number }}
          path: release-pkg/*

      - name: Create GitHub Release
        if: ${{ inputs.create_release }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="v1.0-r${{ github.run_number }}"
          RELEASE_TITLE="Carbon Kernel v1.0 (cupid) - KernelSU-${{ inputs.ksu_variant }}"
          gh release create "${TAG_NAME}" \
            release-pkg/* \
            --title "${RELEASE_TITLE}" \
            --notes "Carbon Kernel for Xiaomi 12 (cupid / SM8450) with KernelSU-${{ inputs.ksu_variant }}"
