name: Build Carbon Kernel (cupid)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      ksu_variant:
        description: "KernelSU Variant"
        required: true
        default: "next"
        type: choice
        options:
          - "next"
          - "official"
          - "none"
      compiler:
        description: "Select Compiler"
        required: true
        default: "AOSP-Clang"
        type: choice
        options:
          - "AOSP-Clang"
          - "Neutron-Clang"
      create_release:
        description: "Create GitHub Release"
        type: boolean
        default: true

jobs:
  Build-Carbon:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write

    steps:
      - name: 🔄 Checkout Carbon Builder
        uses: actions/checkout@v4

      - name: ⏰ Prepare timezone
        run: |
          sudo ln -sf /usr/share/zoneinfo/Asia/Jakarta /etc/localtime

      - name: 📦 Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc cpio flex bison git python-is-python3 tar aria2 perl wget curl lz4 libssl-dev libelf-dev dwarves zip zstd

      - name: ⚙️ Setup Environment
        run: |
          echo "BUILD_TIME=$(TZ=Asia/Jakarta date '+%d%m%Y-%H%M')" >> "$GITHUB_ENV"
          echo "BUILD_DATE=\"$(TZ=Asia/Jakarta date '+%b %d %Y')\"" >> "$GITHUB_ENV"

      - name: 🔧 Setup Compiler
        shell: bash
        run: |
          set -e
          mkdir -p clang

          if [[ "${{ github.event.inputs.compiler }}" == "Neutron-Clang" ]]; then
            echo "Using Neutron Clang..."
            CLANG_URL=$(curl -fsSL https://api.github.com/repos/Neutron-Toolchains/clang-build-catalogue/releases/latest | grep "browser_download_url" | grep "neutron-clang" | head -n 1 | cut -d '"' -f 4)
            echo "Downloading: $CLANG_URL"
            curl -L "$CLANG_URL" -o neutron-clang.tar.zst
            tar -C clang -xf neutron-clang.tar.zst
            rm -f neutron-clang.tar.zst
          else
            echo "Using Google Android Clang r416183b (Clang 12.0.5 - Official ACK / LineageOS 24)..."
            toolchain_repo="${RUNNER_TEMP}/android-clang-repo"
            rm -rf "${toolchain_repo}"
            git clone --filter=blob:none --no-checkout --depth=1 \
              --branch master-kernel-build-2021 \
              https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 "${toolchain_repo}"
            git -C "${toolchain_repo}" sparse-checkout set clang-r416183b
            git -C "${toolchain_repo}" checkout -q --detach 6e3223f76384455acde43affde3df0ea9df66c0d
            mv "${toolchain_repo}/clang-r416183b"/* clang/
            rm -rf "${toolchain_repo}"
          fi

          echo "CLANG_PATH=$GITHUB_WORKSPACE/clang" >> "$GITHUB_ENV"
          echo "Compiler version:"
          "$GITHUB_WORKSPACE/clang/bin/clang" --version | head -n 1
          "$GITHUB_WORKSPACE/clang/bin/ld.lld" --version | head -n 1

      - name: Clone Kernel Source (LineageOS SM8450)
        run: |
          git clone --depth=1 --branch lineage-24.0 https://github.com/LineageOS/android_kernel_xiaomi_sm8450 kernel-source
          cd kernel-source
          echo "Kernel commit: $(git rev-parse HEAD)"

      - name: Setup KernelSU-Next
        if: ${{ inputs.ksu_variant != 'none' }}
        run: |
          cd kernel-source
          if [ "${{ inputs.ksu_variant }}" = "next" ]; then
            echo "Setting up KernelSU-Next..."
            curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -s next
          elif [ "${{ inputs.ksu_variant }}" = "official" ]; then
            echo "Setting up official KernelSU..."
            curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -
          fi

      - name: 💾 Setup Swap Space
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 16

      - name: 🛠️ Build Kernel
        shell: bash
        run: |
          set -e
          cd kernel-source
          export PATH="${CLANG_PATH}/bin:${PATH}"
          export ARCH=arm64
          export SUBARCH=arm64
          export KBUILD_BUILD_USER=hrihq
          export KBUILD_BUILD_HOST=LineageOS
          export LLVM=1
          export LLVM_IAS=1
          export CC=clang
          export LD=ld.lld

          # Free runner disk
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost /usr/share/swift || true
          free -h

          # 1. Base GKI defconfig
          make O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 gki_defconfig

          # 2. Merge vendor fragments for cupid
          ./scripts/kconfig/merge_config.sh -O out -m out/.config \
            arch/arm64/configs/vendor/waipio_GKI.config \
            arch/arm64/configs/vendor/xiaomi_GKI.config \
            arch/arm64/configs/vendor/cupid_GKI.config

          # 3. KernelSU flag
          if [ "${{ inputs.ksu_variant }}" != "none" ]; then
            ./scripts/config --file out/.config -e KSU
          fi

          # 4. Brand localversion
          ./scripts/config --file out/.config --set-str LOCALVERSION "-Carbon-cupid"

          # 5. ThinLTO config with 2 parallel threads wrapper to prevent link OOM
          ./scripts/config --file out/.config -d LTO_NONE -d LTO_CLANG_FULL -e LTO_CLANG -e LTO_CLANG_THIN

          # 6. Restored modular ZRAM/ZSMALLOC to prevent early-init ramdisk conflicts on Android 16/17
          ./scripts/config --file out/.config -m ZRAM -m ZSMALLOC

          make O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 olddefconfig

          wrapper="${GITHUB_WORKSPACE}/ld-thinlto-wrapper"
          printf '#!/bin/bash\nexec ld.lld "$@" --thinlto-jobs=2\n' > "${wrapper}"
          chmod +x "${wrapper}"
          export LD="${wrapper}"
          export HOSTLD="${wrapper}"

          # Build Image (cap jobs to 2 during linking to avoid OOM killer)
          make -j2 O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 Image

          if [ ! -s out/arch/arm64/boot/Image ]; then
            echo "::error::Built Image not found!"
            exit 1
          fi
          ls -lh out/arch/arm64/boot/Image
          cp out/.config out/carbon_defconfig.txt

      - name: 💾 Upload Config
        uses: actions/upload-artifact@v4
        with:
          name: configs-${{ env.BUILD_TIME }}
          path: kernel-source/out/carbon_defconfig.txt

      - name: 📂 Package AnyKernel3 ZIP
        run: |
          mkdir -p ak3-pkg
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git ak3-pkg
          cp ak3/anykernel.sh ak3-pkg/anykernel.sh
          cp ak3/banner ak3-pkg/banner
          cp kernel-source/out/arch/arm64/boot/Image ak3-pkg/Image

          ZIP_NAME="Carbon-Kernel-cupid-SagittariusA-${{ inputs.ksu_variant }}-${BUILD_TIME}.zip"
          cd ak3-pkg
          zip -r9 "../${ZIP_NAME}" . -x ".git/*" "README.md" ".github/*"
          cd ..
          sha256sum "${ZIP_NAME}" > "${ZIP_NAME}.sha256"

          echo "ZIP_NAME=${ZIP_NAME}" >> "$GITHUB_ENV"
          echo "ZIP_SHA256=$(cat ${ZIP_NAME}.sha256 | awk '{print $1}')" >> "$GITHUB_ENV"
          mkdir -p release-pkg
          mv "${ZIP_NAME}" release-pkg/
          mv "${ZIP_NAME}.sha256" release-pkg/
          cp kernel-source/out/arch/arm64/boot/Image release-pkg/Image-cupid

      - name: 📤 Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Carbon-Kernel-cupid-${{ inputs.ksu_variant }}
          path: release-pkg/*

      - name: 🚀 Publish GitHub Release
        if: ${{ inputs.create_release }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REL_TAG="v1.0-${BUILD_TIME}"
          RELEASE_TITLE="Carbon Kernel v1.0 — Sagittarius A* (cupid)"
          gh release create "${REL_TAG}" \
            release-pkg/* \
            --title "${RELEASE_TITLE}" \
            --notes "Carbon Kernel v1.0 — Sagittarius A* (cupid / SM8450) | SHA256: ${{ env.ZIP_SHA256 }}"
