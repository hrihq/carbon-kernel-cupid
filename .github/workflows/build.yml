name: Build Carbon Kernel (cupid)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      create_release:
        description: "Create GitHub Release and Post to Telegram"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  Build-Carbon:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: write

    steps:
      - name: Checkout Carbon Builder
        uses: actions/checkout@v4

      - name: Prepare timezone
        run: |
          sudo ln -sf /usr/share/zoneinfo/Asia/Jakarta /etc/localtime

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc cpio flex bison git python-is-python3 tar aria2 perl wget curl lz4 libssl-dev libelf-dev dwarves zip zstd

      - name: Setup Environment
        run: |
          echo "BUILD_TIME=$(TZ=Asia/Jakarta date '+%d%m%Y-%H%M')" >> "$GITHUB_ENV"
          echo "BUILD_DATE=\"$(TZ=Asia/Jakarta date '+%b %d %Y')\"" >> "$GITHUB_ENV"

      - name: Setup Compiler (Android Clang r596125)
        shell: bash
        run: |
          set -e
          mkdir -p clang

          echo "Using Google Android Clang r596125 (Clang 22.0.2 - Official Android 17 / Infinity-X 4.1 Toolchain)..."
          toolchain_repo="${RUNNER_TEMP}/android-clang-repo"
          rm -rf "${toolchain_repo}"
          git clone --filter=blob:none --no-checkout --depth=1 \
            https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 "${toolchain_repo}"
          git -C "${toolchain_repo}" sparse-checkout set clang-r596125
          git -C "${toolchain_repo}" checkout -q
          mv "${toolchain_repo}/clang-r596125"/* clang/
          rm -rf "${toolchain_repo}"

          echo "CLANG_PATH=$GITHUB_WORKSPACE/clang" >> "$GITHUB_ENV"
          echo "Compiler version:"
          "$GITHUB_WORKSPACE/clang/bin/clang" --version | head -n 1
          "$GITHUB_WORKSPACE/clang/bin/ld.lld" --version | head -n 1

      - name: Clone Kernel Source (LineageOS SM8450)
        run: |
          git clone --depth=1 --branch lineage-24.0 https://github.com/LineageOS/android_kernel_xiaomi_sm8450 kernel-source
          cd kernel-source
          echo "Kernel commit: $(git rev-parse HEAD)"

      - name: Apply Latest SUSFS Patches
        run: |
          git clone --depth=1 --branch gki-android12-5.10 https://gitlab.com/simonpunk/susfs4ksu.git susfs-repo
          cd kernel-source
          patch -p1 < ../susfs-repo/kernel_patches/50_add_susfs_in_gki-android12-5.10.patch
          cp -r ../susfs-repo/kernel_patches/fs/* fs/
          cp -r ../susfs-repo/kernel_patches/include/linux/* include/linux/
          echo "SUSFS patch applied successfully!"

      - name: Apply Carbon v1.2 Tweaks (Charging Floor and WALT Scroll Cooling)
        run: |
          cd kernel-source
          python3 ../scripts/apply_tweaks.py

      - name: Setup KernelSU-Next with SUSFS Support
        run: |
          cd kernel-source
          git clone --depth=1 --branch dev-susfs https://github.com/pershoot/KernelSU-Next.git KernelSU-Next
          cd drivers
          ln -sf ../KernelSU-Next/kernel kernelsu
          grep -q "kernelsu" Makefile || printf "\nobj-\$(CONFIG_KSU) += kernelsu/\n" >> Makefile
          grep -q "drivers/kernelsu/Kconfig" Kconfig || sed -i '/endmenu/i\source "drivers/kernelsu/Kconfig"' Kconfig
          echo "KernelSU-Next dev-susfs integrated!"

      - name: Setup Swap Space
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 16

      - name: Build Dual Kernels (Root + NonRoot)
        shell: bash
        run: |
          set -e
          cd kernel-source
          export PATH="${CLANG_PATH}/bin:${PATH}"
          export ARCH=arm64
          export SUBARCH=arm64
          export KBUILD_BUILD_USER=kuroya14
          export KBUILD_BUILD_HOST=LineageOS
          export LLVM=1
          export LLVM_IAS=1
          export CC=clang
          export LD=ld.lld

          # Free runner disk
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost /usr/share/swift || true
          free -h

          # 1. Base verified Infinity-X 4.1 defconfig
          cp ../arch/arm64/configs/carbon_cupid_defconfig arch/arm64/configs/carbon_cupid_defconfig
          make O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 carbon_cupid_defconfig

          # 2. KernelSU + SUSFS Configurations
          ./scripts/config --file out/.config -e KSU \
            -e KSU_SUSFS \
            -e KSU_SUSFS_SUS_PATH \
            -e KSU_SUSFS_SUS_MOUNT \
            -e KSU_SUSFS_SUS_KSTAT \
            -e KSU_SUSFS_SPOOF_UNAME \
            -e KSU_SUSFS_ENABLE_LOG \
            -e KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS \
            -e KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG \
            -e KSU_SUSFS_OPEN_REDIRECT \
            -e KSU_SUSFS_SUS_MAP

          # 3. Tweaks: TCP BBR, FQ, Anti-Stutter
          ./scripts/config --file out/.config \
            -e TCP_CONG_ADVANCED -e TCP_CONG_BBR -e DEFAULT_BBR --set-str DEFAULT_TCP_CONG "bbr" \
            -e NET_SCH_DEFAULT -e DEFAULT_FQ --set-str DEFAULT_NET_SCH "fq" \
            -e TMPFS_POSIX_ACL -e TMPFS_XATTR

          # 4. Brand localversion
          ./scripts/config --file out/.config --set-str LOCALVERSION "-Carbon-cupid"

          make O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 olddefconfig

          # --- BUILD 1: Image-root (KernelSU-Next + SUSFS) ---
          echo "========================================="
          echo " Compiling Image-root (KSU + SUSFS)..."
          echo "========================================="
          make -j2 O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 Image
          mkdir -p ../built-kernels
          cp out/arch/arm64/boot/Image ../built-kernels/Image-root
          cp out/.config ../built-kernels/carbon_defconfig.txt

          # --- BUILD 2: Image-nonroot (Clean / Vanilla) ---
          echo "========================================="
          echo " Compiling Image-nonroot (Vanilla)..."
          echo "========================================="
          ./scripts/config --file out/.config -d KSU -d KSU_SUSFS
          make O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 olddefconfig
          make -j2 O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 Image
          cp out/arch/arm64/boot/Image ../built-kernels/Image-nonroot
          ls -lh ../built-kernels/

      - name: Upload Config
        uses: actions/upload-artifact@v4
        with:
          name: configs-${{ env.BUILD_TIME }}
          path: built-kernels/carbon_defconfig.txt

      - name: Package Dual AnyKernel3 ZIP
        run: |
          mkdir -p ak3-pkg/kernels
          cp -r ak3/* ak3-pkg/
          cp built-kernels/Image-root ak3-pkg/kernels/Image-root
          cp built-kernels/Image-nonroot ak3-pkg/kernels/Image-nonroot

          ZIP_NAME="Carbon-Kernel-cupid-CygnusX1-${BUILD_TIME}.zip"
          cd ak3-pkg
          zip -r9 "../${ZIP_NAME}" . -x ".git/*" "README.md" ".github/*"
          cd ..
          sha256sum "${ZIP_NAME}" > "${ZIP_NAME}.sha256"

          echo "ZIP_NAME=${ZIP_NAME}" >> "$GITHUB_ENV"
          echo "ZIP_SHA256=$(cat ${ZIP_NAME}.sha256 | awk '{print $1}')" >> "$GITHUB_ENV"
          mkdir -p release-pkg
          mv "${ZIP_NAME}" release-pkg/
          mv "${ZIP_NAME}.sha256" release-pkg/
          cp built-kernels/Image-root release-pkg/Image-root
          cp built-kernels/Image-nonroot release-pkg/Image-nonroot

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Carbon-Kernel-cupid-CygnusX1
          path: release-pkg/*

      - name: Publish GitHub Release
        if: ${{ inputs.create_release }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REL_TAG="v1.2-${BUILD_TIME}"
          echo "REL_TAG=${REL_TAG}" >> "$GITHUB_ENV"
          RELEASE_TITLE="Carbon Kernel v1.2 - Cygnus-X1 (cupid)"
          gh release create "${REL_TAG}" \
            release-pkg/* \
            --title "${RELEASE_TITLE}" \
            --notes "Carbon Kernel v1.2 - CygnusX1 (cupid / SM8450) with KernelSU-Next, SUSFS v2.3.0, TCP BBR, and Dual-Build Selector | SHA256: ${{ env.ZIP_SHA256 }}"

      - name: Forward Release to Telegram Channel
        if: ${{ inputs.create_release }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python3 scripts/send_telegram.py
