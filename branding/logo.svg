<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#141923" />
      <stop offset="70%" stop-color="#0a0c10" />
      <stop offset="100%" stop-color="#050608" />
    </radialGradient>

    <!-- Carbon Fiber Hex Pattern -->
    <pattern id="carbonMesh" width="32" height="55.42" patternUnits="userSpaceOnUse">
      <path d="M16 0 L32 9.24 L32 27.71 L16 36.95 L0 27.71 L0 9.24 Z" fill="none" stroke="#ffffff" stroke-width="0.7" opacity="0.04"/>
      <path d="M16 27.71 L32 36.95 L32 55.42 L16 64.66 L0 55.42 L0 36.95 Z" fill="none" stroke="#ffffff" stroke-width="0.7" opacity="0.04"/>
    </pattern>

    <!-- Neon Cyan Core Gradient -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#00c0fa" />
      <stop offset="100%" stop-color="#0072ff" />
    </linearGradient>

    <!-- Carbon Ring Gradient -->
    <linearGradient id="carbonMetal" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#3a4454" />
      <stop offset="50%" stop-color="#1e2430" />
      <stop offset="100%" stop-color="#0f131a" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="100" fill="url(#bgGlow)" />
  <rect width="512" height="512" rx="100" fill="url(#carbonMesh)" />

  <!-- Outer Hex Shield (Carbon Fiber Bezel) -->
  <polygon points="256,48 430,148 430,348 256,448 82,348 82,148"
           fill="url(#carbonMetal)"
           stroke="#2d3748"
           stroke-width="3" />

  <!-- Hexagon Circuit Accents -->
  <polygon points="256,66 414,157 414,339 256,430 98,339 98,157"
           fill="none"
           stroke="url(#cyanGrad)"
           stroke-width="2"
           stroke-dasharray="14 8"
           opacity="0.4" />

  <!-- Outer Glow Arc for the C -->
  <path d="M340,165 A140,140 0 1,0 340,347"
        fill="none"
        stroke="#00f2fe"
        stroke-width="32"
        stroke-linecap="round"
        opacity="0.15"
        filter="url(#neonGlow)" />

  <!-- Primary Bold "C" Mark (Carbon Kernel) -->
  <path d="M345,170 A135,135 0 1,0 345,342"
        fill="none"
        stroke="url(#cyanGrad)"
        stroke-width="28"
        stroke-linecap="round" />

  <!-- Inner CPU Chip Core -->
  <g transform="translate(206, 206)">
    <!-- Microprocessor Core -->
    <rect x="0" y="0" width="100" height="100" rx="20" fill="#0b0e14" stroke="#00f2fe" stroke-width="3" />
    
    <!-- Chip Pins -->
    <line x1="28" y1="-8" x2="28" y2="0" stroke="#00f2fe" stroke-width="3" stroke-linecap="round"/>
    <line x1="50" y1="-8" x2="50" y2="0" stroke="#00f2fe" stroke-width="3" stroke-linecap="round"/>
    <line x1="72" y1="-8" x2="72" y2="0" stroke="#00f2fe" stroke-width="3" stroke-linecap="round"/>

    <line x1="28" y1="100" x2="28" y2="108" stroke="#00f2fe" stroke-width="3" stroke-linecap="round"/>
    <line x1="50" y1="100" x2="50" y2="108" stroke="#00f2fe" stroke-width="3" stroke-linecap="round"/>
    <line x1="72" y1="100" x2="72" y2="108" stroke="#00f2fe" stroke-width="3" stroke-linecap="round"/>

    <line x1="-8" y1="28" x2="0" y2="28" stroke="#00f2fe" stroke-width="3" stroke-linecap="round"/>
    <line x1="-8" y1="50" x2="0" y2="50" stroke="#00f2fe" stroke-width="3" stroke-linecap="round"/>
    <line x1="-8" y1="72" x2="0" y2="72" stroke="#00f2fe" stroke-width="3" stroke-linecap="round"/>

    <line x1="100" y1="28" x2="108" y2="28" stroke="#00f2fe" stroke-width="3" stroke-linecap="round"/>
    <line x1="100" y1="50" x2="108" y2="50" stroke="#00f2fe" stroke-width="3" stroke-linecap="round"/>
    <line x1="100" y1="72" x2="108" y2="72" stroke="#00f2fe" stroke-width="3" stroke-linecap="round"/>

    <!-- Inner Core Nexus Icon -->
    <circle cx="50" cy="50" r="16" fill="url(#cyanGrad)" />
    <circle cx="50" cy="50" r="8" fill="#0b0e14" />
    <circle cx="50" cy="50" r="3.5" fill="#00f2fe" />
  </g>

  <!-- Cupid Device Indicator Orbit (Small delicate arrow / node at top right) -->
  <circle cx="355" cy="155" r="7" fill="#00f2fe" filter="url(#neonGlow)"/>
  <circle cx="355" cy="357" r="7" fill="#0072ff" filter="url(#neonGlow)"/>
</svg>
